<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>待辦清單</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <section class="todo-card" aria-label="待辦清單卡片">
      <header class="card-header">
        <h1 class="title">待辦清單</h1>

        <button id="themeToggle" class="theme-toggle" type="button" aria-label="切換深色模式">
          <span class="theme-toggle-icon" aria-hidden="true">🌙</span>
          <span class="theme-toggle-text">深色模式</span>
        </button>
      </header>

      <form class="todo-form" id="todoForm">
        <label class="sr-only" for="todoInput">輸入待辦事項</label>
        <input
          id="todoInput"
          class="todo-input"
          type="text"
          placeholder="輸入待辦事項..."
          autocomplete="off"
        />
        <button class="add-btn" type="submit">新增</button>
      </form>

      <div class="filter-group" aria-label="待辦事項篩選">
        <button class="filter-btn active" data-filter="all" type="button">全部</button>
        <button class="filter-btn" data-filter="active" type="button">未完成</button>
        <button class="filter-btn" data-filter="completed" type="button">已完成</button>
      </div>

      <p class="empty-state" id="emptyState">還沒有任何待辦事項,新增一個吧!</p>

      <ul class="todo-list" id="todoList" aria-live="polite"></ul>

      <footer class="todo-footer">
        <div class="todo-footer-row">
          <p id="todoCount">未完成:0 項</p>
          <button
            id="clearCompletedBtn"
            class="clear-completed-btn"
            type="button"
            aria-label="清除所有已完成項目"
          >
            清除已完成
          </button>
        </div>
      </footer>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
